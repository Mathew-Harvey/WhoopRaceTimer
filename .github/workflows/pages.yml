# Publish static/ to GitHub Pages, which serves it at whooptimer.webfpv.org
# (static/CNAME) over HTTPS. HTTPS is not decoration here: Web Bluetooth and
# Web Serial only exist in a secure context, so a plain-http host cannot run
# this app at all.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pages has to be switched on once by hand — Settings -> Pages -> Source:
      # GitHub Actions. The workflow token is not allowed to create the site
      # itself, and configure-pages says so plainly when it has not been done.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
