name: Tests

on:
  push:
  pull_request:

jobs:
  protocol-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 tests/test_protocol_parity.py
      - run: node tests/test_race_engine.mjs
      - run: node tests/test_tuning.mjs
      - run: node tests/test_calibrate.mjs
      # The LapRF wire format, pinned so a second timer cannot quietly change it.
      - run: python3 tests/test_laprf_golden.py
