<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WhoopTimer — lap timing for whoop racing</title>
<meta name="description" content="Lap timing for an ImmersionRC LapRF, straight from your browser. Connect over Bluetooth or USB, practice solo or run a four-pilot race, with spoken lap times.">
<meta name="theme-color" content="#07090c">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WhoopTimer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <main id="main">
    <div class="screen"><div class="connect"><div class="inner">
      <div class="searching"><div class="spinner"></div><strong id="bootMsg">Starting…</strong>
        <p class="muted" id="bootHint" hidden>The app did not load. Check the connection and reload —
        if this keeps happening, clear this site's data in the browser.</p></div>
    </div></div></div>
  </main>
</div>

<div class="ov" id="staging" hidden>
  <div style="display:grid;place-items:center">
    <div class="cd num" id="cdNum">5</div>
    <div class="stagetip" id="cdTip">Arm your quads</div>
    <button class="ghost cancel" id="cdCancel" type="button">Cancel start</button>
  </div>
</div>
<div class="ov" id="goflash" hidden><div class="goword num">GO</div></div>
<!-- A crossing, seen from across a room. Not an overlay: it must not cover the
     lap that just appeared, and it must never swallow a tap. -->
<div id="passflash" hidden></div>

<div id="toasts" role="status" aria-live="polite"></div>

<noscript>
  <div style="padding:24px;max-width:40em;margin:0 auto">
    <h1>WhoopTimer</h1>
    <p>This app talks to a LapRF timer over Bluetooth from inside the browser, so it needs
    JavaScript. Enable it and reload.</p>
  </div>
</noscript>

<script>
  /* A silent hang on "Starting…" is the worst possible first impression. */
  setTimeout(function () {
    if (!window.wt) {
      var m = document.getElementById('bootMsg'), h = document.getElementById('bootHint');
      if (m) m.textContent = 'Still starting…';
      if (h) h.hidden = false;
    }
  }, 9000);
</script>
<script type="module" src="js/boot.js"></script>
</body>
</html>
